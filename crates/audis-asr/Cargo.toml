[package]
name = "audis-asr"
description = "Automatic speech recognition for Audis: VAD, endpointing, and engines."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
audis-common.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

# The local engine. Optional so the workspace still builds without a C++
# toolchain; the app degrades to "no local engine" rather than failing to
# compile. See ADR-011.
whisper-rs = { version = "0.16", optional = true }

# The cloud engines. Blocking on purpose: `AsrEngine::transcribe` is sync and
# runs on a dedicated worker thread, so there is no runtime to block and no
# reason to colour the trait async for one implementation.
reqwest = { version = "0.13.4", features = [
  "blocking",
  "multipart",
  "json",
  "rustls",
], default-features = false }
base64 = "0.22"

# The live engine. A bidirectional socket has to read and write at once, which
# a blocking client cannot do, so this one keeps its own single-threaded runtime
# on its own thread and hands the rest of the crate plain channels. See
# `live.rs`, and ADR-004 for why both shapes exist.
tokio = { version = "1.52", features = [
  "rt",
  "net",
  "time",
  "sync",
  "macros",
], default-features = false }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = [
  "std",
  "sink",
], default-features = false }
# TLS is configured by hand rather than left to defaults: both rustls backends
# are in this tree, and rustls refuses to pick between them.
rustls = { version = "0.23", features = [
  "aws-lc-rs",
  "std",
  "tls12",
], default-features = false }
rustls-native-certs = "0.8"

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["local-whisper"]
# Builds whisper.cpp. Needs MSVC, cmake, Ninja and libclang.
local-whisper = ["dep:whisper-rs"]
