[workspace]
resolver = "3"
members = ["crates/audis-common", "crates/audis-audio", "crates/audis-asr", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.90"
authors = ["Neura Audis"]
license = "Proprietary"
publish = false

[workspace.dependencies]
audis-common = { path = "crates/audis-common" }
audis-audio = { path = "crates/audis-audio" }
audis-asr = { path = "crates/audis-asr" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "time"] }
tracing-appender = "0.2"
uuid = { version = "1.23.5", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0

# Audio capture is unusable when dependencies are unoptimised, so they are built
# with optimisations even in development.
[profile.dev.package."*"]
opt-level = 2
