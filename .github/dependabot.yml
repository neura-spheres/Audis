version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Tauri crates must move together or the build breaks.
      tauri:
        patterns: ["tauri", "tauri-*"]
      tracing:
        patterns: ["tracing", "tracing-*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
