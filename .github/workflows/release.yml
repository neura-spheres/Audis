name: Release

# Tag convention (see docs/releasing.md):
#   v1.2.3         stable
#   v1.2.3-beta.1  beta, published as a GitHub pre-release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Is this a beta?
        id: channel
        shell: bash
        # A tag with a prerelease part is a beta. This drives GitHub's own
        # pre-release flag, so the flag and the tag can never disagree.
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      # whisper.cpp is C++, so the Rust build needs libclang to bind it.
      # See docs/adr/ADR-011.
      - name: Install LLVM
        run: choco install llvm -y

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater refuses anything not signed by this key. It exists only
          # as a repository secret; it is never in the tree.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Audis ${{ github.ref_name }}
          releaseBody: ${{ github.event.head_commit.message }}
          releaseDraft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
          # Publishes the installers, their .sig files, and the latest.json
          # manifest the in-app updater reads.
          includeUpdaterJson: true
